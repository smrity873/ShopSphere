{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-blue-200 rounded-xl shadow-md shadow-blue-950 p-6">
  <h1 class="text-2xl font-bold text-center mb-4">Login</h1>

  <form method="post" class="space-y-3 [&_input]:w-full [&_input]:rounded-lg [&_input]:px-3 [&_input]:py-2 [&_input]:bg-white [&_input]:outline-none [&_label]:font-semibold [&_ul]:text-sm [&_ul]:text-red-600">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-lg hover:bg-slate-700">Login</button>
  </form>

  <p class="text-center mt-4 text-sm">
    অ্যাকাউন্ট নেই? <a href="{% url 'signup' %}" class="text-blue-700 font-semibold">Sign Up</a>
  </p>
</div>
{% endblock %}
